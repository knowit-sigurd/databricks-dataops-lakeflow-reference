name: Cleanup PR Pipelines

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(gh pr view ${{ github.event.number }} \
            --repo ${{ github.repository }} \
            --json files --jq '.files[].path')
          echo "Changed files:"
          echo "$CHANGED"
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qvE '^(docs/.*|README\.md|\.github/PULL_REQUEST_TEMPLATE\.md|Makefile|uv\.lock|\.devcontainer/.*)$'; then
            echo "code=true" >> $GITHUB_OUTPUT
            echo "Code changes detected — cleanup will run"
          else
            echo "code=false" >> $GITHUB_OUTPUT
            echo "Docs-only PR — nothing was deployed, skipping cleanup"
          fi

  cleanup:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.298.0/install.sh | sh

      - name: Install uv
        run: |
          curl -Ls https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Validate PR context
        run: |
          if [ -z "${{ github.event.number }}" ]; then
            echo "No PR number found, aborting cleanup"
            exit 1
          fi

      - name: Print cleanup context
        run: |
          echo "Cleaning pipeline for PR: ${{ github.event.number }}"
          echo "Suffix: pr_${{ github.event.number }}"

      - name: Destroy PR bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle destroy \
            -t dev \
            --var=deployment_suffix=pr_${{ github.event.number }} \
            --var=target_schema=sdp_pr_${{ github.event.number }} \
            --var=source_path=/Volumes/dataops_lab/sdp_pr_${{ github.event.number }}/raw \
            --auto-approve

      - name: Delete orphaned pipeline and job if exists
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          uv run python scripts/cleanup_orphaned_pipeline.py pr_${{ github.event.number }}

      - name: Drop PR schema
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set +e
          OUTPUT=$(databricks schemas delete dataops_lab.sdp_pr_${{ github.event.number }} --force -t dev 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qi "not found\|does not exist\|no schema"; then
              echo "Schema not found — nothing to clean up"
            else
              echo "Schema delete failed with unexpected error"
              exit 1
            fi
          fi
