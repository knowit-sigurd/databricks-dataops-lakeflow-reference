name: Deploy SDP Pipelines

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: dev
        type: choice
        options: [dev, test]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Resolve target
        id: target
        run: |
          echo "target=${{ inputs.target }}" >> $GITHUB_OUTPUT

      - name: Print deployment context
        run: |
          echo "Deploying target: ${{ steps.target.outputs.target }}"
          echo "Git ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle validate -t ${{ steps.target.outputs.target }}
          databricks bundle deploy -t ${{ steps.target.outputs.target }}