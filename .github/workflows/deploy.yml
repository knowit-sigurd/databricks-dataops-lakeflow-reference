name: Deploy SDP Pipelines

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: dev
        type: choice
        options: [dev]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED=$(gh pr view ${{ github.event.number }} \
              --repo ${{ github.repository }} \
              --json files --jq '.files[].path')
          elif [ "${{ github.event_name }}" == "push" ]; then
            CHANGED=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
              --jq '[.files[].filename] | .[]')
          else
            # workflow_dispatch — always deploy
            echo "code=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qvE '^(docs/.*|README\.md|\.github/PULL_REQUEST_TEMPLATE\.md)$'; then
            echo "code=true" >> $GITHUB_OUTPUT
            echo "Code changes detected — deploy will run"
          else
            echo "code=false" >> $GITHUB_OUTPUT
            echo "Docs-only change — deploy will be skipped"
          fi

  deploy-pr:
    needs: changes
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pr-${{ github.event.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.298.0/install.sh | sh

      - name: Install uv
        run: |
          curl -Ls https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Resolve deployment context
        id: resolve_context
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "target=dev" >> $GITHUB_OUTPUT
            echo "deployment_suffix=pr_${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "target_schema=sdp_pr_${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "source_path=/Volumes/dataops_lab/sdp_pr_${{ github.event.number }}/raw" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> $GITHUB_OUTPUT
            echo "deployment_suffix=${{ inputs.target }}" >> $GITHUB_OUTPUT
            echo "target_schema=sdp_dev" >> $GITHUB_OUTPUT
            echo "source_path=/Volumes/dataops_lab/sdp_dev/raw" >> $GITHUB_OUTPUT
          fi

      - name: Print deployment context
        run: |
          echo "Deploying target: ${{ steps.resolve_context.outputs.target }}"
          echo "Deployment suffix: ${{ steps.resolve_context.outputs.deployment_suffix }}"
          echo "Git ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Create PR schema
        if: github.event_name == 'pull_request'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set +e
          OUTPUT=$(databricks schemas create \
            sdp_pr_${{ github.event.number }} \
            dataops_lab \
            -t dev 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qi "already exists"; then
              echo "Schema already exists — skipping creation"
            else
              echo "Schema creation failed with unexpected error"
              exit 1
            fi
          fi

      - name: Create PR volume
        if: github.event_name == 'pull_request'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set +e
          OUTPUT=$(databricks volumes create \
            dataops_lab \
            sdp_pr_${{ github.event.number }} \
            raw \
            MANAGED -t dev 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qi "already exists"; then
              echo "Volume already exists — skipping creation"
            else
              echo "Volume creation failed with unexpected error"
              exit 1
            fi
          fi

      - name: Upload source data
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          chmod +x scripts/upload_data.sh
          ./scripts/upload_data.sh \
            "${{ steps.resolve_context.outputs.target }}" \
            "${{ steps.resolve_context.outputs.target_schema }}"

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          # Destroy any stale state from a previous failed deploy so that
          # bundle deploy can recreate the pipeline rather than failing on
          # "already exists". Safe no-op when no state exists.
          databricks bundle destroy \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }} \
            --var=source_path=${{ steps.resolve_context.outputs.source_path }} \
            --auto-approve 2>/dev/null || true

          # bundle destroy only removes resources it tracked in state. If a
          # previous deploy created the pipeline but failed before writing state,
          # the pipeline is invisible to bundle destroy. Delete it by name so
          # bundle deploy can create a fresh one.
          uv run python scripts/cleanup_orphaned_pipeline.py \
            ${{ steps.resolve_context.outputs.deployment_suffix }}

          # Remove the local Terraform state directory so bundle deploy uses
          # the remote state cleanly. Without this, a fresh CI runner creates
          # a new local state (new lineage) that conflicts with the remote
          # state from a previous run, causing a lineage mismatch error.
          rm -rf .databricks/bundle

          databricks bundle validate \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }} \
            --var=source_path=${{ steps.resolve_context.outputs.source_path }}

          databricks bundle plan \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }} \
            --var=source_path=${{ steps.resolve_context.outputs.source_path }}

          databricks bundle deploy \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }} \
            --var=source_path=${{ steps.resolve_context.outputs.source_path }} \
            --auto-approve

      # workflow_dispatch deploys the bundle only — pipeline run and count assertions
      # are gated on pull_request events and do not execute on manual dispatch.
      - name: Stop any active pipeline updates
        if: github.event_name == 'pull_request'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          uv run python scripts/stop_pipeline.py \
            ${{ steps.resolve_context.outputs.deployment_suffix }}_medallion_pipeline

      - name: Run pipeline
        if: github.event_name == 'pull_request'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle run medallion_pipeline \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }} \
            --refresh-all

      - name: Assert row counts
        if: github.event_name == 'pull_request'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: |
          uv run python scripts/validate_counts.py ${{ steps.resolve_context.outputs.target_schema }}

  deploy-prod:
    needs: changes
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.298.0/install.sh | sh

      - name: Print deployment context
        run: |
          echo "Deploying target: prod"
          echo "Deployment suffix: prod"
          echo "Git ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Upload source data
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          chmod +x scripts/upload_data.sh
          ./scripts/upload_data.sh prod

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle validate \
            -t prod \
            --var=deployment_suffix=prod \
            --var=target_schema=sdp_prod

          databricks bundle plan \
            -t prod \
            --var=deployment_suffix=prod \
            --var=target_schema=sdp_prod

          databricks bundle deploy \
            -t prod \
            --var=deployment_suffix=prod \
            --var=target_schema=sdp_prod \
            --auto-approve
