name: Deploy SDP Pipelines

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: dev
        type: choice
        options: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Resolve deployment context
        id: resolve_context
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "target=dev" >> $GITHUB_OUTPUT
            echo "deployment_suffix=pr_${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "target_schema=sdp_pr_${{ github.event.number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_name }}" == "main" ]; then
            echo "target=prod" >> $GITHUB_OUTPUT
            echo "deployment_suffix=prod" >> $GITHUB_OUTPUT
            echo "target_schema=sdp_prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> $GITHUB_OUTPUT
            echo "deployment_suffix=${{ inputs.target }}" >> $GITHUB_OUTPUT
            echo "target_schema=sdp_dev" >> $GITHUB_OUTPUT
          else
            echo "Unsupported event/ref combination"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref_name }}"
            exit 1
          fi

      - name: Print deployment context
        run: |
          echo "Deploying target: ${{ steps.resolve_context.outputs.target }}"
          echo "Deployment suffix: ${{ steps.resolve_context.outputs.deployment_suffix }}"
          echo "Git ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Upload source data
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          chmod +x scripts/upload_data.sh
          ./scripts/upload_data.sh ${{ steps.resolve_context.outputs.target }}

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle validate \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }}

          databricks bundle plan \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }}

          databricks bundle deploy \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }} \
            --auto-approve

      - name: Run pipeline
        if: github.event_name == 'pull_request'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle run medallion_pipeline \
            -t ${{ steps.resolve_context.outputs.target }} \
            --var=deployment_suffix=${{ steps.resolve_context.outputs.deployment_suffix }} \
            --var=target_schema=${{ steps.resolve_context.outputs.target_schema }} \
            --refresh-all