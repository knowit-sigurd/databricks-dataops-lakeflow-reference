name: Failure Demo

on:
  workflow_dispatch:

jobs:
  demo-failure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Attach git branch for bundle metadata
        run: git checkout -B ${{ github.ref_name }}

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.298.0/install.sh | sh

      - name: Create demo schema
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set +e
          OUTPUT=$(databricks schemas create sdp_demo dataops_lab -t dev 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qi "already exists"; then
              echo "Schema already exists — skipping creation"
            else
              echo "Schema creation failed with unexpected error"
              exit 1
            fi
          fi

      - name: Create demo volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set +e
          OUTPUT=$(databricks volumes create dataops_lab sdp_demo raw MANAGED -t dev 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qi "already exists"; then
              echo "Volume already exists — skipping creation"
            else
              echo "Volume creation failed with unexpected error"
              exit 1
            fi
          fi

      - name: Upload bad customers + normal orders and CDC
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks fs cp data/bad/customers.csv \
            dbfs:/Volumes/dataops_lab/sdp_demo/raw/customers.csv --overwrite -t dev
          databricks fs cp data/orders.csv \
            dbfs:/Volumes/dataops_lab/sdp_demo/raw/orders.csv --overwrite -t dev
          databricks fs mkdirs dbfs:/Volumes/dataops_lab/sdp_demo/raw/cdc -t dev
          databricks fs cp data/customers_cdc.csv \
            dbfs:/Volumes/dataops_lab/sdp_demo/raw/cdc/customers_cdc.csv --overwrite -t dev

      - name: Deploy bundle with quality_mode=fail
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle deploy -t dev \
            --var=deployment_suffix=demo \
            --var=target_schema=sdp_demo \
            --var=source_path=/Volumes/dataops_lab/sdp_demo/raw \
            --var=quality_mode=fail \
            --auto-approve

      - name: Run pipeline — expect failure
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          if databricks bundle run medallion_pipeline -t dev \
            --var=deployment_suffix=demo \
            --var=target_schema=sdp_demo \
            --var=source_path=/Volumes/dataops_lab/sdp_demo/raw \
            --var=quality_mode=fail; then
            echo "ERROR: pipeline should have failed but succeeded"
            exit 1
          else
            echo "Pipeline failed as expected — quality_mode=fail contract verified"
          fi
