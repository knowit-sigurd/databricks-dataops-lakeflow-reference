[project]
name = "databricks-dataops-lakeflow-reference"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "databricks-bundles>=0.299.2",
    "databricks-sdk>=0.119.0",
    "pyspark>=4.1.1",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.13",
    "setuptools>=82.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipelines"]