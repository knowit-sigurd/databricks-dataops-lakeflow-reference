[project]
name = "databricks-dataops-lakeflow-reference"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "databricks-sdk>=0.108.0",
    "pyspark>=4.1.1",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.4",
    "setuptools>=82.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipelines"]