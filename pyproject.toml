[project]
name = "databricks-dataops-lakeflow-reference"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "databricks-sdk>=0.106.0",
    "pyspark>=3.5",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "setuptools>=70",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipelines"]