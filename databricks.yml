bundle:
  name: dataops-lab-sdp

variables:
  deployment_suffix:
    default: dev
  target_schema:
    default: sdp_dev

targets:
  dev:
    mode: development
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com

  test:
    mode: development
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
    variables:
      target_schema: sdp_prod
    resources:
      pipelines:
        customer_pipeline:
          configuration:
            quality_mode: fail
            pipelines.maxFlowRetryAttempts: "0"
            pipelines.numUpdateRetryAttempts: "0"
        orders_pipeline:
          configuration:
            quality_mode: fail
            pipelines.maxFlowRetryAttempts: "0"
            pipelines.numUpdateRetryAttempts: "0"

resources:
  pipelines:
    customer_pipeline:
      name: "${var.deployment_suffix}_customer_pipeline"
      catalog: dataops_lab
      schema: "${var.target_schema}"
      configuration:
        quality_mode: drop
      libraries:
        - file:
            path: ./pipelines/customer_pipeline.py
        - file:
            path: ./pipelines/common.py
        - file:
            path: ./pipelines/customers.py
      serverless: true
    orders_pipeline:
      name: "${var.deployment_suffix}_orders_pipeline"
      catalog: dataops_lab
      schema: "${var.target_schema}"
      configuration:
        quality_mode: drop
      libraries:
        - file:
            path: ./pipelines/orders_pipeline.py
        - file:
            path: ./pipelines/common.py
        - file:
            path: ./pipelines/orders.py
      serverless: true
