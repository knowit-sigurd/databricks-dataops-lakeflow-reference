bundle:
  name: dataops-lab-sdp
  databricks_cli_version: ">= 0.298.0, < 1.0.0"

variables:
  deployment_suffix:
    default: dev
  target_schema:
    default: sdp_dev
  source_path:
    default: "/Volumes/dataops_lab/sdp_dev/raw"
  quality_mode:
    default: drop
  warehouse_id:
    default: "0bd7cc78c0abd6d9"

presets:
  tags:
    domain: retail
    data_product: customer_orders
    environment: "${bundle.target}"
    owner: data-engineering
    git_commit: "${bundle.git.commit}"
    git_branch: "${bundle.git.branch}"

targets:
  dev:
    mode: development
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/${bundle.target}/${var.deployment_suffix}

  prod:
    mode: production
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    git:
      branch: main
    variables:
      target_schema: sdp_prod
      quality_mode: fail
      source_path: "/Volumes/dataops_lab/sdp_prod/raw"
    resources:
      pipelines:
        medallion_pipeline:
          configuration:
            pipelines.maxFlowRetryAttempts: "0"
            pipelines.numUpdateRetryAttempts: "0"
          # run_as pins the pipeline run identity independently of who deployed.
          # Not set here because prod is always CI-deployed under dataops-lab-sp,
          # making it a no-op. Declare it in multi-team setups where engineers can
          # deploy to shared targets:
          # run_as:
          #   service_principal_name: dataops-lab-sp
      jobs:
        medallion_operational_job:
          # run_as:
          #   service_principal_name: dataops-lab-sp


resources:
  pipelines:
    medallion_pipeline:
      name: "${var.deployment_suffix}_medallion_pipeline"
      catalog: dataops_lab
      target: "${var.target_schema}"
      serverless: true
      configuration:
        quality_mode: "${var.quality_mode}"
        source_path: "${var.source_path}"
      libraries:
        - file:
            path: ./pipelines/customer_pipeline.py
        - file:
            path: ./pipelines/orders_pipeline.py
        - file:
            path: ./pipelines/gold_pipeline.py
        - file:
            path: ./pipelines/customers.py
        - file:
            path: ./pipelines/orders.py
        - file:
            path: ./pipelines/gold.py
        - file:
            path: ./pipelines/common.py
        - file:
            path: ./pipelines/cdc_pipeline.py

  jobs:
    medallion_operational_job:
      name: ${var.deployment_suffix}_medallion_operational_job
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion_pipeline.id}
            full_refresh: false
        - task_key: assert_output
          depends_on:
            - task_key: run_pipeline
          spark_python_task:
            python_file: ./scripts/assert_job_output.py
            parameters:
              - ${var.target_schema}
              - ${var.warehouse_id}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - "databricks-sdk>=0.106.0"
