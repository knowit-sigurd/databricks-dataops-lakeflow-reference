bundle:
  name: dataops-lab-sdp
  databricks_cli_version: ">= 0.298.0, < 1.0.0"
  git:
    branch: main

variables:
  deployment_suffix:
    default: dev
  target_schema:
    default: sdp_dev
  source_path:
    default: "/Volumes/dataops_lab/sdp_dev/raw"
  quality_mode:
    default: drop
  warehouse_id:
    default: "0bd7cc78c0abd6d9"

targets:
  dev:
    mode: development
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/${bundle.target}/${var.deployment_suffix}

  prod:
    mode: production
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    git:
      branch: main
    variables:
      target_schema: sdp_prod
      quality_mode: fail
      source_path: "/Volumes/dataops_lab/sdp_prod/raw"
    resources:
      pipelines:
        medallion_pipeline:
          configuration:
            pipelines.maxFlowRetryAttempts: "0"
            pipelines.numUpdateRetryAttempts: "0"


resources:
  pipelines:
    medallion_pipeline:
      name: "${var.deployment_suffix}_medallion_pipeline"
      catalog: dataops_lab
      target: "${var.target_schema}"
      serverless: true
      configuration:
        quality_mode: "${var.quality_mode}"
        source_path: "${var.source_path}"
      libraries:
        - file:
            path: ./pipelines/customer_pipeline.py
        - file:
            path: ./pipelines/orders_pipeline.py
        - file:
            path: ./pipelines/gold_pipeline.py
        - file:
            path: ./pipelines/customers.py
        - file:
            path: ./pipelines/orders.py
        - file:
            path: ./pipelines/gold.py
        - file:
            path: ./pipelines/common.py

  jobs:
    medallion_operational_job:
      name: ${var.deployment_suffix}_medallion_operational_job
      job_clusters:
        - job_cluster_key: default
          new_cluster:
            num_workers: 0
            spark_version: "15.4.x-scala2.12"
            node_type_id: "m5.large"
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
            aws_attributes:
              ebs_volume_type: GENERAL_PURPOSE_SSD
              ebs_volume_count: 1
              ebs_volume_size: 32
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion_pipeline.id}
            full_refresh: false
        - task_key: assert_and_persist
          depends_on:
            - task_key: run_pipeline
          job_cluster_key: default
          libraries:
            - pypi:
                package: databricks-sdk>=0.106.0
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/assert_and_persist.py
            parameters:
              - ${var.target_schema}
              - ${var.warehouse_id}
