bundle:
  name: dataops-lab-sdp

variables:
  deployment_suffix:
    default: dev
  target_schema:
    default: sdp_dev

targets:
  dev:
    mode: development
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com

  test:
    mode: development
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
    variables:
      target_schema: sdp_prod

resources:
  pipelines:
    customer_pipeline:
      name: "${var.deployment_suffix}_customer_pipeline"
      catalog: dataops_lab
      schema: "${var.target_schema}"
      libraries:
        - file:
            path: ./pipelines/customer_pipeline.py
      serverless: true
      continuous: false
    orders_pipeline:
      name: "${var.deployment_suffix}_orders_pipeline"
      catalog: dataops_lab
      schema: "${var.target_schema}"
      libraries:
        - file:
            path: ./pipelines/orders_pipeline.py
      serverless: true
      continuous: false
