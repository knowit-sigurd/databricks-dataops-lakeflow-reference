bundle:
  name: dataops-lab-sdp

targets:
  dev:
    mode: development
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com

resources:
  pipelines:
    customer_pipeline:
      name: "${bundle.target}_${bundle.git.branch | replace('/', '_')}_customer_pipeline"
      catalog: dataops_lab
      schema: sdp
      libraries:
        - file:
            path: ./pipelines/customer_pipeline.py
      serverless: true
    orders_pipeline:
      name: "${bundle.target}_${bundle.git.branch | replace('/', '_')}_orders_pipeline"
      catalog: dataops_lab
      schema: sdp
      libraries:
        - file:
            path: ./pipelines/orders_pipeline.py
      serverless: true